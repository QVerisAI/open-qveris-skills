name: Validate finance report examples

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-finance-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate finance reports and JSON fixtures
        run: make validate-finance-reports
